<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Favicon">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <clipPath id="frameInner">
      <rect x="116" y="148" width="280" height="220" rx="34"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#brand)"/>

  <!-- Heavier strokes and a tighter crop than the full logo: at 16px the logo's
       thinner frame closes up, so the favicon trades detail for weight. -->
  <rect x="98" y="130" width="316" height="256" rx="52" fill="none" stroke="#ffffff" stroke-width="36"/>

  <g clip-path="url(#frameInner)">
    <circle cx="180" cy="207" r="30" fill="#ffffff"/>
    <path d="M116 368 L206 262 L266 326 L308 282 L396 368 Z" fill="#ffffff"/>
  </g>

  <path d="M404 54 C404 112 404 121 466 121 C404 121 404 130 404 188 C404 130 404 121 342 121 C404 121 404 112 404 54 Z"
        fill="#ffffff" stroke="url(#brand)" stroke-width="34" stroke-linejoin="round"/>
  <path d="M404 54 C404 112 404 121 466 121 C404 121 404 130 404 188 C404 130 404 121 342 121 C404 121 404 112 404 54 Z"
        fill="#ffffff"/>
</svg>
